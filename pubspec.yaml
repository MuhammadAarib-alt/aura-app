name: aura_life
description: AURA - AI Life Manager

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  google_sign_in: ^6.2.1
  firebase_core: ^2.27.1
  firebase_auth: ^4.19.1

  google_generative_ai: ^0.4.3

  smooth_page_indicator: ^1.1.0
  lottie: ^3.1.0
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  curved_navigation_bar: ^1.0.3
  percent_indicator: ^4.2.3
  fl_chart: ^0.67.0

  shared_preferences: ^2.2.3
  provider: ^6.1.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
